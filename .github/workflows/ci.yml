name: CI

# Lint + typecheck + unit tests + production build on every PR and on pushes to
# main, so main stays green.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the build only on high/critical advisories in *production*
      # dependencies (what actually ships to users). Dev-only advisories are
      # surfaced by the non-blocking audit below and by Dependabot PRs.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (advisory)
        run: npm audit || true

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public placeholders so the build's client bundle compiles in CI.
          # Real values live in Vercel; nothing secret is needed to type-check/build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # Runs AFTER the build so Next's generated route types (.next/types —
      # LayoutProps<>, PageProps<>) exist; a cold `tsc` can't resolve them.
      # This still adds value over the build's own check: it verifies the test
      # files, which the production build doesn't compile.
      - name: Typecheck
        run: npm run typecheck
